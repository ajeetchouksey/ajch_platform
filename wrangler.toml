name            = "aarya-subscribe"
main            = "workers/subscribe.ts"
compatibility_date = "2026-06-05"
# Kept on so the old *.workers.dev URL keeps working during the migration to
# the custom domain below — safe to turn off once nothing references it.
workers_dev     = true

# ── Custom domain ─────────────────────────────────────────────────────────────
# api.aaryaai.dev instead of aarya-subscribe.<account>.workers.dev — the latter
# leaks the Cloudflare account name and looks untrustworthy on a Google/GitHub
# OAuth consent screen. Cloudflare auto-provisions the DNS record + TLS cert
# for this on `wrangler deploy` since aaryaai.dev is already a zone on this
# account. After deploying, update:
#   - GitHub OAuth App callback URL (github.com/settings/developers)
#   - Google OAuth Client redirect URI (console.cloud.google.com)
#   → both to https://api.aaryaai.dev/oauth/... instead of the old workers.dev URL
[[routes]]
pattern = "api.aaryaai.dev"
custom_domain = true

# ── KV namespace — per-IP rate limiting (5 req / 15 min) ─────────────────────
# One-time setup:
#   1. wrangler kv namespace create RATE_LIMITER
#   2. Copy the returned `id` value and paste it below.
[[kv_namespaces]]
binding = "RATE_LIMITER"
id      = "11f07ef9b0c5432bb9a232390d3ec672"

# ── KV namespace — comment moderation admin allowlist (IDEA-0009 Phase 4.1) ──
# One key per admin, format `${provider}:${id}` (e.g. "github:ajeetchouksey"),
# value unused (presence = grant). Add/remove an admin with a single
# `wrangler kv key put|delete --binding=ADMINS "<key>" ...` — no redeploy, no
# shared-secret rotation, affects only that one person. See resolveAdmin() in
# workers/subscribe.ts. ADMIN_API_SECRET (below) remains as a legacy fallback.
[[kv_namespaces]]
binding = "ADMINS"
id      = "71f0e6b95533405598ec16729851fc5d"

# ── D1 database — subscriber list (replaces the Gist read-modify-write) ──────
# Created via: wrangler d1 create aarya-subscribers
# Schema applied via: wrangler d1 execute aarya-subscribers --file=workers/schema.sql (--local for dev, --remote for prod)
[[d1_databases]]
binding     = "DB"
database_name = "aarya-subscribers"
database_id = "2f397d9b-4d45-4c1d-aa1e-3c474f58dd32"

# ── Plaintext vars (non-secret feature flags) ────────────────────────────────
# IDEA-0009 Phase 2 — NFR-4 (privacy disclosure) resolved via the inline copy
# in LightComments.tsx (no separate /legal/privacy page yet). Flipped on for
# the Use Cases rollout (FR-9) now that LightComments.tsx is wired in.
# Still fails closed at runtime (503) until `wrangler secret put
# COMMENT_IP_SALT` is run against the deployed Worker — see the secrets list
# below — so this flag alone does not make comment intake live in production.
[vars]
COMMENTS_ENABLED = "true"

# ── Secrets — set via CLI, never commit values ────────────────────────────────
# Run each of the following (you will be prompted to paste the value):
#
#   wrangler secret put GIST_TOKEN
#     → paste the fine-grained PAT (aarya-subscribe-gist-pat, Gists R/W) — still
#       used for the public aggregate-stats gist (aarya-stats.json); the private
#       subscriber-list gist is retired in favour of the D1 database above.
#
#   wrangler secret put PUBLIC_STATS_GIST_ID
#     → <REPLACE_WITH_PUBLIC_STATS_GIST_ID>
#
#   wrangler secret put GH_APP_ID
#     → <REPLACE_WITH_GH_APP_ID>
#
#   wrangler secret put GH_APP_PRIVATE_KEY
#     → paste the full .pem file contents (multi-line is fine)
#
#   wrangler secret put GH_APP_INSTALLATION_ID
#     → <REPLACE_WITH_GH_APP_INSTALLATION_ID>
#
#   wrangler secret put ANTHROPIC_API_KEY
#     → paste your Anthropic API key (powers /mentor/* endpoints)
#
#   wrangler secret put GH_CLIENT_ID
#     → paste your GitHub OAuth App client_id (from github.com/settings/developers)
#
#   wrangler secret put GH_CLIENT_SECRET
#     → paste your GitHub OAuth App client_secret (NEVER commit this value)
#
#   wrangler secret put GOOGLE_CLIENT_ID
#     → paste your Google OAuth Client ID (Google Cloud Console → APIs & Services →
#       Credentials → OAuth client ID → Web application). NOT the same secret as
#       ga4-proxy.ts's GOOGLE_CLIENT_ID — that's a separate Worker/wrangler config
#       for owner-only GA4 API access. Create a distinct client here, scoped to
#       `openid email profile` only, with redirect URI:
#       https://api.aaryaai.dev/oauth/google/callback
#
#   wrangler secret put GOOGLE_CLIENT_SECRET
#     → paste the matching Google OAuth client secret (NEVER commit this value)
#
#   wrangler secret put SESSION_SIGNING_KEY
#     → random 32+ byte string, e.g. `openssl rand -hex 32`. Signs the session
#       tokens minted for Google logins (see workers/subscribe.ts).
#
#   wrangler secret put COMMENT_IP_SALT
#     → random 32+ byte string, e.g. `openssl rand -hex 32`. Pepper mixed into
#       the IP hash stored on each comment row (IDEA-0009 NFR-3) — without a
#       real secret here, hashing falls back to a fixed dev-only string, which
#       is fine locally but must be set before COMMENTS_ENABLED ever flips to
#       "true" in production.
#
#   wrangler secret put ADMIN_API_SECRET
#     → random 32+ byte string, e.g. `openssl rand -hex 32`. Interim admin auth
#       for comment moderation (IDEA-0009 Phase 4, FR-6/FR-12) — checked as
#       `Authorization: Bearer <token>` on the hide/unhide/lock/unlock routes.
#       Unset = every moderation call 403s. A stopgap until a real per-admin
#       identity path exists (see the Env doc comment in workers/subscribe.ts).
#
# Microsoft login is deferred (no Entra app registered yet) — when it's added,
# it'll need MS_CLIENT_ID / MS_CLIENT_SECRET secrets in this same style, plus
# an Entra App registration with supported account types = "Accounts in any
# organizational directory and personal Microsoft accounts" and redirect URI
# https://api.aaryaai.dev/oauth/microsoft/callback.
#
# ── Deploy ────────────────────────────────────────────────────────────────────
# After secrets are set:
#   wrangler deploy
# This provisions the api.aaryaai.dev custom domain (see [[routes]] above)
# automatically — no manual DNS/dashboard step needed. Set it in Vite:
#   VITE_SUBSCRIBE_WORKER_URL=https://api.aaryaai.dev
#   VITE_GH_OAUTH_PROXY=https://api.aaryaai.dev
#
# Set VITE_STATS_GIST_ID=<REPLACE_WITH_PUBLIC_STATS_GIST_ID> in Vite env as well.
