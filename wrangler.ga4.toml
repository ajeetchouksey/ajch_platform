name            = "aarya-ga4-proxy"
main            = "workers/ga4-proxy.ts"
compatibility_date = "2026-06-05"
workers_dev     = true

# ── KV namespace — auth cache + GA4 response cache ───────────────────────────
# One-time setup:
#   1. wrangler kv namespace create GA4_CACHE --config wrangler.ga4.toml
#   2. Paste the returned id below.
[[kv_namespaces]]
binding = "GA4_CACHE"
id      = "56f523216ef14f57bff29b1029426527"

# ── D1 database — persistent daily analytics history ─────────────────────────
# Independent of GA4's own retention window and the KV cache's 15-min TTL —
# populated by a daily Cron Trigger (below) plus a one-time /api/ga/backfill
# call, read by GET /api/ga/history. See workers/schema-analytics.sql.
# One-time setup:
#   1. wrangler d1 create aarya-analytics --config wrangler.ga4.toml
#   2. Paste the returned database_id below.
#   3. wrangler d1 execute aarya-analytics --file=workers/schema-analytics.sql --config wrangler.ga4.toml (--local for dev, --remote for prod)
[[d1_databases]]
binding       = "ANALYTICS_DB"
database_name = "aarya-analytics"
database_id   = "d34f9b7a-374f-4e0c-89e7-a202b4966286"

# ── Cron Trigger — daily snapshot of the last 3 days into ANALYTICS_DB ───────
# 3 days (not just yesterday) because GA4 data can still shift for ~48h after
# a day ends; re-snapshotting self-heals via the table's ON CONFLICT upsert.
# Time chosen to run well after GA4's own processing window for the prior day.
[triggers]
crons = ["15 3 * * *"]

# ── OAuth client ID — not secret, safe to commit (paired with the
# GOOGLE_CLIENT_SECRET secret below) ──────────────────────────────────────────
[vars]
GOOGLE_CLIENT_ID = "939308613423-4iu2mv9tapb7tfekrpl9c8fichbo85rb.apps.googleusercontent.com"

# ── Secrets — set via CLI, never commit values ────────────────────────────────
#
# Option A — Service Account (requires GCP billing):
#   wrangler secret put GA4_SERVICE_ACCOUNT_B64 --config wrangler.ga4.toml
#     → base64-encode your service-account JSON first:
#       [System.Convert]::ToBase64String([System.IO.File]::ReadAllBytes('sa.json'))
#
# Option B — OAuth user account (no billing required):
#   wrangler secret put GOOGLE_CLIENT_SECRET --config wrangler.ga4.toml
#     → from Google Cloud Console → APIs & Services → Credentials → OAuth 2.0 Client
#   Add as plain var in wrangler.ga4.toml [vars]:
#     GOOGLE_CLIENT_ID = "YOUR_CLIENT_ID.apps.googleusercontent.com"
#   Then open /monitoring and click "Connect Google Analytics"
#
# Both options also require:
#   wrangler secret put GA4_PROPERTY_ID --config wrangler.ga4.toml
#     → paste your numeric GA4 property ID (e.g. 123456789)
#
# ── Routes ────────────────────────────────────────────────────────────────────
# After deploy, set in Vite:
#   VITE_GA4_PROXY_URL=https://aarya-ga4-proxy.<subdomain>.workers.dev
#
# ── Deploy ────────────────────────────────────────────────────────────────────
#   wrangler deploy --config wrangler.ga4.toml
#
# ── One-time backfill (after deploy, once GA4 is connected) ──────────────────
# From the browser, signed in as the owner:
#   fetch(`${PROXY_URL}/api/ga/backfill`, { method: 'POST',
#     headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${githubToken}` },
#     body: JSON.stringify({ startDate: '2026-05-01', endDate: '<today>' }) })
# Check the response's `earliestDateReturned` against the requested
# `startDate` — GA4's account-level data retention setting can silently
# truncate how far back a report actually returns data.
