name: CI — Build Check
# Owned by DevOps Agent. Do not modify without DevOps Agent review.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]   # also run on feature branches (not main — deploy.yml handles that)

# Cancel redundant runs on the same branch — saves Actions minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: TypeScript + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts
        env:
          HUSKY: '0'

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build
        env:
          # Non-secret build vars — intentionally empty for PR builds;
          # the build must succeed without real tokens.
          VITE_REPO_BASE: /ajch_platform/

      - name: Check bundle size budget
        run: |
          # 700KB — comfortably above the known largest lazy chunk (mermaid's
          # vendor deps, ~650KB, only loaded on the 6 pages that render diagrams)
          # but still catches an un-split bundle like the pre-lazy-loading 1.3MB main chunk.
          OVERSIZED=$(find dist/assets -name '*.js' -size +700k)
          if [ -n "$OVERSIZED" ]; then
            echo "Chunks exceeding 700KB budget:"
            echo "$OVERSIZED"
            exit 1
          fi
