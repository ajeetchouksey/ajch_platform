name: Monitoring Snapshot Sync
# Weekly rollup of GA4 traffic + Cloudflare Worker/D1 health, written to
# public/content/monitoring-snapshot.json so agents (mvp-strategist,
# product-manager) can read it like any other static content file --
# neither agent can hold the dashboard's GitHub-OAuth owner auth.
#
# Weekly, not daily: mvp-strategist itself only runs about once a week
# (see agentLastRun/agentNextRun in mvp-progress.json), so refreshing this
# more often than it's consumed would just be noise.
#
# Requires GitHub secret: MONITORING_SYNC_KEY (same value must also be set
# as a Worker secret on both aarya-ga4-proxy and aarya-cf-monitor via
# `wrangler secret put MONITORING_SYNC_KEY --config wrangler.ga4.toml` /
# `--config wrangler.cf-monitor.toml`).
#
# Opens a PR instead of pushing straight to main -- main's branch protection
# (required PR + "TypeScript + Build" status check) started rejecting this
# job's direct `git push origin HEAD:main` once that ruleset was added, so
# every run silently fetched fresh data and then discarded it at the push
# step. Same root cause and same fix as content-intelligence-sync.yml (fixed
# 2026-09-09) -- copying its proven pattern rather than reinventing it:
#
# Mints an aarya-platform-bot App installation token (App ID 3972716, an
# "always" bypass actor on this repo's branch ruleset) instead of the default
# GITHUB_TOKEN -- a PR/push authenticated as GITHUB_TOKEN does not trigger
# other pull_request-triggered workflows (GitHub's anti-recursion
# safeguard), so the required "TypeScript + Build" check would never run at
# all and the PR would sit blocked forever.
#
# Merges the PR itself by polling for the required check then calling
# `gh pr merge --admin`, NOT GitHub's native queued `--auto` merge --
# content-intelligence-sync.yml's own investigation found native auto-merge
# does not apply the App's bypass_actors entry the same way an explicit
# synchronous merge call does (PR sat mergeStateStatus=BLOCKED even after
# every check passed; an explicit --admin merge with the same App token
# succeeded immediately).

on:
  schedule:
    - cron: '0 6 * * 0'   # every Sunday at 06:00 UTC, after content-health.yml's Sunday-00:00 run
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # Mints a short-lived installation token for aarya-platform-bot -- same
      # App, same pattern as content-intelligence-sync.yml /
      # sync-vertical-agents.yml. Requires the App to have Pull requests:
      # Read & write (Contents: Read & write is already granted).
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build monitoring snapshot
        env:
          GA4_PROXY_URL: https://aarya-ga4-proxy.ajeetchouksey27.workers.dev
          CF_MONITOR_URL: https://aarya-cf-monitor.ajeetchouksey27.workers.dev
          MONITORING_SYNC_KEY: ${{ secrets.MONITORING_SYNC_KEY }}
        run: node scripts/build-monitoring-snapshot.mjs

      - name: Open PR and merge if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/content/monitoring-snapshot.json

          if git diff --cached --quiet; then
            echo "No change to monitoring snapshot."
            exit 0
          fi

          branch="chore/monitoring-snapshot-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -B "${branch}"
          git commit -m "chore(monitoring): refresh weekly snapshot"
          git push --set-upstream origin "${branch}"

          pr_url=$(gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore(monitoring): refresh weekly snapshot ($(date -u +%Y-%m-%d))" \
            --body "Automated weekly GA4 + Cloudflare snapshot refresh — see \`scripts/build-monitoring-snapshot.mjs\`. Single generated JSON file, no app code touched.")

          # Poll for the required check, then merge explicitly with --admin
          # (this App's ID is already an "always" bypass actor on this
          # repo's ruleset) -- see the file header comment for why native
          # `gh pr merge --auto` doesn't work here.
          for _ in $(seq 1 20); do
            checks_output=$(gh pr checks "${pr_url}" --required 2>&1) || true
            if echo "${checks_output}" | grep -qE 'fail|cancel'; then
              echo "::error::Required check failed on ${pr_url} — leaving PR open for manual review."
              echo "${checks_output}"
              exit 1
            fi
            if ! echo "${checks_output}" | grep -qi 'pending'; then
              gh pr merge "${pr_url}" --squash --delete-branch --admin
              exit 0
            fi
            sleep 15
          done
          echo "::error::Required check on ${pr_url} did not resolve within 5 minutes — leaving PR open for manual review."
          exit 1
