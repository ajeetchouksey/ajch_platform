name: Deploy to GitHub Pages
# v4 — uses actions/deploy-pages to match "GitHub Actions" Pages source setting
#
# DISABLED (automatic trigger removed): aaryaai.dev's DNS now points at
# Cloudflare Pages (see .github/workflows/deploy-cloudflare-pages.yml and
# docs/agent-framework.md's sibling context in the Phase 2 migration work) —
# GitHub Pages no longer receives production traffic. This workflow is kept,
# not deleted, as a rollback path: trigger it manually (workflow_dispatch,
# via the Actions tab or `gh workflow run deploy.yml`) if Cloudflare Pages
# ever needs to be rolled back from. Re-add the `push: branches: [main]`
# trigger below to resume automatic deploys.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --ignore-scripts
        env:
          HUSKY: '0'

      - name: Build
        env:
          HUSKY: '0'
          VITE_REPO_BASE: /
          VITE_GH_CLIENT_ID: ${{ secrets.VITE_GH_CLIENT_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_GA4_PROXY_URL: ${{ vars.VITE_GA4_PROXY_URL }}
          VITE_CONVERTKIT_FORM_ID: ${{ secrets.VITE_CONVERTKIT_FORM_ID }}
          VITE_SUBSCRIBE_WORKER_URL: https://aarya-subscribe.ajeetchouksey27.workers.dev
          VITE_GH_OAUTH_PROXY: https://aarya-subscribe.ajeetchouksey27.workers.dev
          VITE_STATS_GIST_ID: 4ccf1b49e144256342d92bab727fbb89
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
