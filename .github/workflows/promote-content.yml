name: Promote Content

on:
  workflow_dispatch:
    inputs:
      vertical:
        description: Vertical to promote
        required: true
        type: choice
        options:
          - blog
          - skillup
          - usecases
          - interviews
          - pathways
          - hol-labs
      repo:
        description: GitHub repo slug in owner/name form
        required: true
        type: string
      sha:
        description: Pinned commit SHA to promote
        required: true
        type: string
      base_url:
        description: CDN base URL for the promoted repo
        required: false
        default: https://cdn.jsdelivr.net/gh
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  promote:
    name: Promote content manifest entry
    runs-on: ubuntu-latest

    steps:
      # Mints a short-lived installation token for aarya-platform-bot -- same
      # App, same pattern as content-intelligence-sync.yml /
      # monitoring-snapshot-sync.yml. Without this, the "Open promotion PR"
      # step below authenticates as the default GITHUB_TOKEN, which does NOT
      # trigger other pull_request-triggered workflows (GitHub's
      # anti-recursion safeguard) -- so ci.yml's required "TypeScript +
      # Build" check never fires and the PR sits mergeStateStatus=BLOCKED
      # forever. Confirmed live: PR #617 (promoting hol-labs) needed a manual
      # `gh pr merge --admin` because of exactly this.
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate repo and SHA exist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERTICAL: ${{ inputs.vertical }}
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          if ! curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/commits/${SHA}" > /tmp/commit.json; then
            echo "::error::Could not find commit ${SHA} in ${REPO}."
            exit 1
          fi

          case "${VERTICAL}" in
            blog|usecases|interviews|pathways|hol-labs) remote_path="content/${VERTICAL}/index.json" ;;
            skillup) remote_path="content/${VERTICAL}/catalog.json" ;;
            *) echo "::error::Unsupported vertical: ${VERTICAL}"; exit 1 ;;
          esac

          curl -fsSL "https://raw.githubusercontent.com/${REPO}/${SHA}/${remote_path}" > /tmp/vertical.json

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/vertical.json', 'utf8'));
          const declared = payload.schemaVersion ?? payload.schema ?? null;
          const match = String(declared ?? '').match(/\d+/);
          const version = match ? Number(match[0]) : null;
          if (!Number.isInteger(version) || version < 1) {
            throw new Error(`Missing supported schemaVersion in fetched content; found ${String(declared)}`);
          }
          if (![1].includes(version)) {
            throw new Error(`Unsupported schemaVersion ${version}; supported versions: 1`);
          }
          NODE

      - name: Update content-manifest.json
        env:
          VERTICAL: ${{ inputs.vertical }}
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          # The running app fetches /content-manifest.json at runtime, which
          # Vite serves from public/ -- not the repo-root copy. Both must be
          # updated or the promotion silently never reaches the live site.
          paths = ['content-manifest.json', 'public/content-manifest.json']
          promoted_at = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')

          # Read from the environment, not shell-interpolated into this heredoc --
          # the heredoc delimiter ('PY') is quoted specifically so bash does NOT
          # expand $VARS before Python sees the script. "${VERTICAL}" etc. as
          # literal text previously wrote the placeholder strings themselves into
          # the manifest instead of the real values (shipped broken; caught when
          # promoting skillup on 2026-08-26).
          vertical = os.environ['VERTICAL']
          repo = os.environ['REPO']
          sha = os.environ['SHA']
          base_url = os.environ['BASE_URL']

          for path in paths:
              with open(path, encoding='utf-8') as f:
                  data = json.load(f)

              data[vertical] = {
                  "repo": repo,
                  "sha": sha,
                  "baseUrl": base_url,
                  "schemaVersion": 1,
                  "promotedAt": promoted_at,
              }

              with open(path, 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=2)
                  f.write('\n')
          PY

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Regenerate content intelligence (stats + freshness)
        run: node scripts/build-content-intelligence.mjs
        continue-on-error: true # a stats-fetch failure must not block the manifest promotion itself

      - name: Open promotion PR and merge if changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERTICAL: ${{ inputs.vertical }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="chore/promote-${VERTICAL}-${SHA:0:12}"
          git checkout -B "${branch}"
          git add content-manifest.json public/content-manifest.json public/content/stats.json public/content/relationships.json public/content/glossary.json

          if git diff --cached --quiet; then
            echo "No manifest change to promote."
            exit 0
          fi

          git commit -m "chore(content): promote ${VERTICAL} to ${SHA}"
          git push --set-upstream origin "${branch}"
          pr_url=$(gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore(content): promote ${VERTICAL} to ${SHA}" \
            --body "Promotes ${VERTICAL} to commit ${SHA} via the content promotion workflow.")

          # Poll for the required check, then merge explicitly with --admin
          # (this App's ID is already an "always" bypass actor on this
          # repo's ruleset) -- see the "Mint App installation token" step's
          # comment for why native `gh pr merge --auto` doesn't work here
          # (content-intelligence-sync.yml's own investigation, 2026-09-09).
          for _ in $(seq 1 20); do
            checks_output=$(gh pr checks "${pr_url}" --required 2>&1) || true
            if echo "${checks_output}" | grep -qE 'fail|cancel'; then
              echo "::error::Required check failed on ${pr_url} — leaving PR open for manual review."
              echo "${checks_output}"
              exit 1
            fi
            if ! echo "${checks_output}" | grep -qi 'pending'; then
              gh pr merge "${pr_url}" --squash --delete-branch --admin
              exit 0
            fi
            sleep 15
          done
          echo "::error::Required check on ${pr_url} did not resolve within 5 minutes — leaving PR open for manual review."
          exit 1
