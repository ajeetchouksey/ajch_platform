name: Content Intelligence Sync

# Keeps public/content/stats.json, relationships.json, and glossary.json
# current without a human remembering to run a script. Two triggers:
#   - repository_dispatch: near-real-time, fired by each vertical repo's own
#     CI on push to main (see scripts/dispatch-content-update.yml template —
#     copied into ajch_skillup / ajch_aaryaai_blogs / ajch_ai_usecases /
#     ajch_hol_labs). Uses the same aarya-platform-bot App already installed
#     with all-repo access for sync-vertical-agents.yml — no new PAT.
#   - schedule: a low-frequency safety net in case a dispatch is missed or
#     fails (belt-and-suspenders, not the primary mechanism).
#
# promote-content.yml handles the promotion-event case directly (its own
# "Regenerate content intelligence" step) — this workflow is for content
# changes inside an ALREADY-promoted vertical repo, which promote-content.yml
# has no visibility into.
#
# Commits via a PR + auto-merge, not a direct push to main (fixed 2026-09-09
# — branch protection now requires a PR + passing checks for every push to
# main, which broke the previous direct-push model: 5 consecutive scheduled
# runs failed silently from 2026-09-08 onward, computing fresh data every
# time but never landing it). Mints an aarya-platform-bot App installation
# token (same App/pattern as sync-vertical-agents.yml) rather than using the
# default GITHUB_TOKEN — a PR/push authenticated as GITHUB_TOKEN does not
# trigger other workflows, so the "TypeScript + Build" required check would
# never run and the PR would sit open forever. (STATS_PAT, a classic PAT
# already sitting in this repo's secrets, was tried first — it can push but
# failed on `gh pr create` with "Resource not accessible by personal access
# token", missing the PR-creation scope.) Repo-wide auto-merge was enabled
# specifically to let this land unattended; it does not weaken branch
# protection itself — nothing merges until its required checks pass.

on:
  repository_dispatch:
    types: [content-updated]
  schedule:
    - cron: '17 */6 * * *' # every 6h, offset to avoid the top of the hour
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Regenerate stats.json
    runs-on: ubuntu-latest

    steps:
      # Mints a short-lived installation token for aarya-platform-bot — same
      # App, same pattern as sync-vertical-agents.yml. STATS_PAT (a classic
      # PAT) was tried first and failed with "Resource not accessible by
      # personal access token" on `gh pr create` — it can push but can't
      # open PRs. Requires the App to have Pull requests: Read & write
      # (Contents: Read & write is already granted, proven by the successful
      # push below) — same one-time manual grant sync-vertical-agents.yml's
      # own comment already calls out.
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Snapshot previous stats
        run: cp public/content/stats.json /tmp/stats-before.json

      - name: Regenerate content intelligence
        run: node scripts/build-content-intelligence.mjs

      - name: Check for a meaningful change
        id: diff
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/stats-before.json', 'utf-8'));
          const after = JSON.parse(fs.readFileSync('public/content/stats.json', 'utf-8'));
          // Compare only the fields that reflect real content changes —
          // "generated" (and freshness timestamps for an already-promoted
          // vertical whose sha hasn't moved) tick on every run regardless,
          // so a raw diff would commit a no-op every 6 hours.
          const meaningful = JSON.stringify(before.platform) !== JSON.stringify(after.platform)
            || JSON.stringify(before.freshness) !== JSON.stringify(after.freshness);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `changed=${meaningful}\n`);
          NODE

      - name: Open PR and enable auto-merge if changed
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="chore/content-intelligence-sync-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -B "${branch}"
          git add public/content/stats.json public/content/relationships.json public/content/glossary.json
          git commit -m "chore(content): regenerate stats.json, relationships.json, glossary.json"
          git push --set-upstream origin "${branch}"

          pr_url=$(gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore(content): regenerate stats.json, relationships.json, glossary.json" \
            --body "Automated — see Content Intelligence Sync workflow run for the diff summary.")
          gh pr merge "${pr_url}" --squash --auto --delete-branch
