name: Sync GA4 Proxy Worker Secrets
# Owned by SRE. Manual, on-demand only — pushes the existing GA4 service-account
# credentials (already used by analytics-sync.yml's Gist-sync cron) into the
# aarya-ga4-proxy Worker's secret store, so the /monitoring dashboard can read
# GA4 data via the Worker's own OAuth2 exchange.
#
# GitHub Secrets are write-only outside CI, so this is the only way to get an
# existing repo secret into a Cloudflare Worker without ever exposing its raw
# value to a human or a chat session — the value only ever exists inside this
# job's environment.
#
# Run whenever: the Worker is first deployed, or GA4_SERVICE_ACCOUNT_KEY /
# GA4_PROPERTY_ID rotate.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Push GA4_SERVICE_ACCOUNT_B64 (base64-encoded service-account JSON)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: |
          echo -n "$GA4_SERVICE_ACCOUNT_KEY" | base64 -w0 | \
            npx wrangler secret put GA4_SERVICE_ACCOUNT_B64 --config wrangler.ga4.toml

      - name: Push GA4_PROPERTY_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          echo -n "$GA4_PROPERTY_ID" | \
            npx wrangler secret put GA4_PROPERTY_ID --config wrangler.ga4.toml

      - name: Summary
        run: echo "✅ GA4_SERVICE_ACCOUNT_B64 and GA4_PROPERTY_ID pushed to aarya-ga4-proxy" >> "$GITHUB_STEP_SUMMARY"
